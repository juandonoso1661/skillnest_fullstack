<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Catálogo - Mercado de Frutas</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- CSS propio -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>

    <!-- ===================================== -->
    <!-- Barra de navegación                   -->
    <!-- ===================================== -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-success">

        <div class="container">

            <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">

                <i class="bi bi-apple"></i>

                Mercado de Frutas

            </a>


            <div>

                <a class="nav-link text-white d-inline me-3" href="{{ url_for('index') }}">

                    Inicio

                </a>


                <a class="nav-link text-white d-inline" href="{{ url_for('catalogo') }}">

                    Catálogo

                </a>

            </div>

        </div>

    </nav>


    <!-- ===================================== -->
    <!-- Encabezado                            -->
    <!-- ===================================== -->

    <header class="hero text-center text-white">

        <div class="container">

            <h1>
                Catálogo de Frutas
            </h1>

            <p>
                Conoce todas las frutas disponibles en nuestro mercado.
            </p>

        </div>

    </header>


    <!-- ===================================== -->
    <!-- Catálogo                              -->
    <!-- ===================================== -->

    <main class="container mt-5">

        <div class="row">

            {% for fruta in frutas %}

            <div class="col-md-6 col-lg-3 mb-4">

                <div class="card fruta-card h-100 shadow-sm">

                    <!-- Imagen -->
                    <img src="{{ url_for('static', filename='images/' + fruta.imagen) }}" class="card-img-top"
                        alt="{{ fruta.nombre }}">


                    <div class="card-body text-center">

                        <!-- Nombre -->
                        <h5 class="card-title">
                            {{ fruta.nombre }}
                        </h5>


                        <!-- Precio -->
                        <h6 class="text-success fw-bold">

                            ${{ fruta.precio }}

                        </h6>


                        <!-- Descripción -->
                        <p class="card-text">

                            {{ fruta.descripcion }}

                        </p>

                    </div>

                </div>

            </div>

            {% endfor %}

        </div>


        <!-- Botón volver -->

        <div class="text-center mb-5">

            <a href="{{ url_for('index') }}" class="btn btn-success">

                <i class="bi bi-cart"></i>

                Realizar una compra

            </a>

        </div>

    </main>


</body>

</html>
