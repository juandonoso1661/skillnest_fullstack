<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercado de frutas</title>
    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <!-- ===================================== --> <!-- Barra de navegación -->
    <!-- ===================================== -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container"> <a class="navbar-brand fw-bold" href="{{ url_for('index') }}"> <i
                    class="bi bi-apple"></i> Mercado de Frutas </a>
            <div> <a class="nav-link text-white d-inline me-3" href="{{ url_for('index') }}"> Inicio </a> <a
                    class="nav-link text-white d-inline" href="{{ url_for('catalogo') }}"> Catálogo </a> </div>
        </div>
    </nav> <!-- ===================================== --> <!-- Encabezado -->
    <!-- ===================================== -->
    <header class="hero text-center text-white">
        <div class="container">
            <h1> Frutas Frescas a Tu Puerta </h1>
            <p> Selecciona tus frutas favoritas y realiza tu pedido. </p>
        </div>
    </header> <!-- ===================================== --> <!-- Formulario principal -->
    <!-- ===================================== -->
    <form action="{{ url_for('checkout') }}" method="POST">
        <div class="container mt-5">
            <div class="row"> <!-- ===================================== --> <!-- Lista de frutas -->
                <!-- ===================================== -->
                <div class="col-lg-8">
                    <div class="card shadow">
                        <div class="card-header">
                            <h3> Selecciona tus frutas </h3>
                        </div>
                        <div class="card-body">
                            <div class="row"> <!-- ===================================== -->
                                <!-- Recorrer frutas con Jinja2 --> <!-- ===================================== --> {%
                                for fruta in frutas %} <div class="col-md-6 mb-4">
                                    <div class="card fruta-card h-100 shadow-sm"> <!-- Imagen --> <img
                                            src="{{ url_for('static', filename='images/' + fruta.imagen) }}"
                                            class="card-img-top" alt="{{ fruta.nombre }}">
                                        <div class="card-body"> <!-- Nombre -->
                                            <h5 class="card-title"> {{ fruta.nombre }} </h5> <!-- Precio -->
                                            <h6 class="text-success fw-bold"> ${{ fruta.precio }} </h6>
                                            <!-- Descripción -->
                                            <p class="card-text"> {{ fruta.descripcion }} </p>
                                        </div> <!-- Cantidad -->
                                        <div class="card-footer bg-white"> <label class="form-label"> Cantidad </label>
                                            <input type="number" class="form-control" min="0" value="0"
                                                name="{{ fruta.nombre }}">
                                        </div>
                                    </div>
                                </div> {% endfor %}
                            </div>
                        </div>
                    </div>
                </div> <!-- ===================================== --> <!-- Información del cliente -->
                <!-- ===================================== -->
                <div class="col-lg-4">
                    <div class="card shadow">
                        <div class="card-header">
                            <h3> Información de Contacto </h3>
                        </div>
                        <div class="card-body"> <!-- Nombre -->
                            <div class="mb-3"> <label class="form-label"> Nombre </label> <input type="text"
                                    class="form-control" name="nombre" placeholder="Ingresa tu nombre" required> </div>
                            <!-- Correo -->
                            <div class="mb-3"> <label class="form-label"> Email </label> <input type="email"
                                    class="form-control" name="email" placeholder="ejemplo@gmail.com" required> </div>
                            <!-- Dirección -->
                            <div class="mb-3"> <label class="form-label"> Dirección de entrega </label> <textarea
                                    class="form-control" rows="3" name="direccion" placeholder="Ingresa tu dirección"
                                    required></textarea> </div>
                            <hr> <!-- Botón --> <button type="submit" class="btn btn-primary w-100"> <i
                                    class="bi bi-cart-fill"></i> Crear Orden </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</body>

</html>
