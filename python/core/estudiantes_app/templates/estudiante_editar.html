<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Estudiante</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <h1>Editar estudiante {{ estudiante.id_estudiante }}</h1>

    {% if error %}
    <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form action="{{ url_for('actualizar_estudiante') }}" method="POST" class="form-container">
        <!-- Campo oculto indispensable para enviar el ID al backend -->
        <input type="hidden" name="id_estudiante" value="{{ estudiante.id_estudiante }}">

        <div class="form-group">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" value="{{ estudiante.nombre }}" required>
        </div>

        <div class="form-group">
            <label for="correo">Correo:</label>
            <input type="email" id="correo" name="correo" value="{{ estudiante.correo }}" required>
        </div>

        <button type="submit" class="btn-submit">Actualizar</button>
    </form>

    <br>
    <a href="{{ url_for('estudiantes') }}">Volver a Estudiantes</a>

</body>

</html>
