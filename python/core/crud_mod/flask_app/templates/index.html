<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-5">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Usuarios</h1>

            <a href="{{ url_for('nuevo') }}" class="btn btn-primary">
                Crear usuario
            </a>
        </div>

        <table class="table table-bordered table-striped">

            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Email</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody>

                {% for usuario in usuarios %}

                <tr>
                    <td>{{ usuario.id }}</td>
                    <td>{{ usuario.nombre }}</td>
                    <td>{{ usuario.apellido }}</td>
                    <td>{{ usuario.email }}</td>

                    <td>
                        <a href="{{ url_for('detalle', id=usuario.id) }}" class="btn btn-info btn-sm">
                            Ver
                        </a>

                        <a href="{{ url_for('editar', id=usuario.id) }}" class="btn btn-warning btn-sm">
                            Editar
                        </a>

                        <a href="{{ url_for('borrar', id=usuario.id) }}" class="btn btn-danger btn-sm"
                            onclick="return confirm('¿Estás seguro de eliminar este usuario?')">
                            Eliminar
                        </a>
                    </td>
                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</body>

</html>
