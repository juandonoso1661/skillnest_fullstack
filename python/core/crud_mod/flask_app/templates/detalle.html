<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del usuario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-5">

        <h1 class="mb-4">Detalle del usuario</h1>

        <div class="card">
            <div class="card-body">

                <h3 class="card-title">
                    {{ usuario.nombre }} {{ usuario.apellido }}
                </h3>

                <p class="card-text">
                    <strong>ID:</strong> {{ usuario.id }}
                </p>

                <p class="card-text">
                    <strong>Nombre:</strong> {{ usuario.nombre }}
                </p>

                <p class="card-text">
                    <strong>Apellido:</strong> {{ usuario.apellido }}
                </p>

                <p class="card-text">
                    <strong>Email:</strong> {{ usuario.email }}
                </p>

                <p class="card-text">
                    <strong>Creado:</strong> {{ usuario.created_at }}
                </p>

                <p class="card-text">
                    <strong>Última actualización:</strong> {{ usuario.updated_at }}
                </p>

                <div class="mt-4">

                    <a href="{{ url_for('editar', id=usuario.id) }}" class="btn btn-warning">
                        Editar
                    </a>

                    <a href="{{ url_for('usuarios') }}" class="btn btn-secondary">
                        Volver
                    </a>

                </div>

            </div>
        </div>

    </div>

</body>

</html>
