<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar usuario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-5">

        <h1 class="mb-4">Editar usuario</h1>

        {% if error %}
        <div class="alert alert-danger">
            {{ error }}
        </div>
        {% endif %}

        <form action="{{ url_for('actualizar', id=usuario.id) }}" method="POST">

            <div class="mb-3">
                <label for="nombre" class="form-label">
                    Nombre
                </label>

                <input type="text" id="nombre" name="nombre" class="form-control" value="{{ usuario.nombre }}">
            </div>

            <div class="mb-3">
                <label for="apellido" class="form-label">
                    Apellido
                </label>

                <input type="text" id="apellido" name="apellido" class="form-control" value="{{ usuario.apellido }}">
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">
                    Email
                </label>

                <input type="email" id="email" name="email" class="form-control" value="{{ usuario.email }}">
            </div>

            <button type="submit" class="btn btn-success">
                Guardar cambios
            </button>

            <a href="{{ url_for('usuarios') }}" class="btn btn-secondary">
                Cancelar
            </a>

        </form>

    </div>

</body>

</html>
