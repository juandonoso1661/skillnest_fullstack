<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>TaskTrack - Nueva Categoría</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
        <a class="navbar-brand fw-bold" href="/tareas">✔ TaskTrack</a>
        <div class="navbar-nav ms-auto align-items-center">
            <a class="nav-link" href="/tareas">Mis Tareas</a>
            <a class="nav-link active" href="/categorias">Categorías</a>
            <span class="text-white mx-3">Hola, {{ session['usuario_nombre'] }}</span>
            <a class="btn btn-outline-light btn-sm" href="/logout">Cerrar Sesión</a>
        </div>
    </nav>

    <div class="container my-4">
        <div class="card shadow-sm p-4 col-md-6 mx-auto">
            <h3>Nueva Categoría</h3>

            {% with messages = get_flashed_messages(category_filter=["categoria"]) %}
            {% if messages %}
            <div class="alert alert-danger p-2 fs-6">
                {% for message in messages %}
                <p class="mb-0">• {{ message }}</p>
                {% endfor %}
            </div>
            {% endif %}
            {% endwith %}

            <form action="/categorias/crear" method="POST">
                <div class="mb-3">
                    <label class="form-label">Nombre:</label>
                    <input type="text" name="nombre_categoria" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-dark">Guardar</button>
                <a href="/categorias" class="btn btn-link">Cancelar</a>
            </form>
        </div>
    </div>
</body>

</html>
