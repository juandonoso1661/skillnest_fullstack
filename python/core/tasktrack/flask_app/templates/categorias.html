<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>TaskTrack - Categorías</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
        <a class="navbar-brand fw-bold" href="/tareas">✔ TaskTrack</a>
        <div class="navbar-nav ms-auto align-items-center">
            <a class="nav-link" href="/tareas">Mis Tareas</a>
            <a class="nav-link active" href="/categorias">Categorías</a>
            <span class="text-white mx-3">Hola, {{ session['usuario_nombre'] }}</span>
            <a class="btn btn-outline-light btn-sm" href="/logout">Cerrar Sesión</a>
        </div>
    </nav>

    <div class="container my-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Categorías</h2>
            <a href="/categorias/nueva" class="btn btn-primary">+ Nueva Categoría</a>
        </div>

        <div class="card shadow-sm col-md-8">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Nombre</th>
                        <th>Cantidad de tareas</th>
                    </tr>
                </thead>
                <tbody>
                    {% for cat in categorias %}
                    <tr>
                        <td class="fw-bold">{{ cat.nombre_categoria }}</td>
                        <td>{{ cat.cantidad_tareas }}</td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="2" class="text-center text-muted">No tienes categorías creadas.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>

</html>
