<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>TaskTrack - Editar Tarea</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
        <a class="navbar-brand fw-bold" href="/tareas">✔ TaskTrack</a>
        <div class="navbar-nav ms-auto align-items-center">
            <a class="nav-link" href="/tareas">Mis Tareas</a>
            <a class="nav-link" href="/categorias">Categorías</a>
            <span class="text-white mx-3">Hola, {{ session['usuario_nombre'] }}</span>
            <a class="btn btn-outline-light btn-sm" href="/logout">Cerrar Sesión</a>
        </div>
    </nav>

    <div class="container my-4">
        <div class="card shadow-sm p-4 col-md-8 mx-auto">
            <h3>Editar Tarea</h3>

            {% with messages = get_flashed_messages(category_filter=["tarea"]) %}
            {% if messages %}
            <div class="alert alert-danger p-2 fs-6">
                {% for message in messages %}
                <p class="mb-0">• {{ message }}</p>
                {% endfor %}
            </div>
            {% endif %}
            {% endwith %}

            <form action="/tareas/actualizar/{{ tarea.id }}" method="POST">
                <div class="mb-3">
                    <label class="form-label">Título:</label>
                    <input type="text" name="titulo" class="form-control" value="{{ tarea.titulo }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Categoría:</label>
                    <select name="categoria_id" class="form-select" required>
                        {% for cat in categorias %}
                        <option value="{{ cat.id }}" {% if cat.id==tarea.categoria_id %}selected{% endif %}>{{
                            cat.nombre_categoria }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Prioridad:</label>
                    <select name="prioridad" class="form-select" required>
                        <option value="Alta" {% if tarea.prioridad=='Alta' %}selected{% endif %}>Alta</option>
                        <option value="Media" {% if tarea.prioridad=='Media' %}selected{% endif %}>Media</option>
                        <option value="Baja" {% if tarea.prioridad=='Baja' %}selected{% endif %}>Baja</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Fecha límite:</label>
                    <input type="date" name="fecha_limite" class="form-control" value="{{ tarea.fecha_limite }}"
                        required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Descripción:</label>
                    <textarea name="descripcion" class="form-control" rows="3"
                        required>{{ tarea.descripcion }}</textarea>
                </div>
                <button type="submit" class="btn btn-dark">Actualizar</button>
                <a href="/tareas/{{ tarea.id }}" class="btn btn-link">Cancelar</a>
            </form>
        </div>
    </div>
</body>

</html>
